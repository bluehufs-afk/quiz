<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOLON QUIZ CHALLENGE</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#edf3ff;background:#091326}*{box-sizing:border-box}body{margin:0}header{background:#14243d;border-bottom:2px solid #cba752;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;color:#f5cb6d;font-size:clamp(18px,2vw,28px)}h2{margin:0 0 15px;font-size:clamp(18px,2vw,25px)}h3{color:#f5cb6d}main{max-width:1800px;margin:auto;padding:16px}.panel{background:#172841;border:1px solid #304a6d;border-radius:16px;padding:20px;margin-bottom:14px}.muted{color:#b6c5d9}.small{font-size:13px}.hidden{display:none!important}.success{color:#86efac}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.narrow{max-width:500px}.pill{background:#29466b;border-radius:99px;padding:6px 12px;text-align:center}button{border:0;border-radius:9px;padding:12px 16px;background:#397cf0;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#415672}button:disabled{opacity:.4;cursor:default}input,textarea,select{background:#0e1c31;color:white;border:1px solid #49617e;border-radius:9px;padding:12px;width:100%;font:inherit}textarea{min-height:90px}label{display:block;margin:12px 0 6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#gameLayout{display:grid;grid-template-columns:minmax(0,3fr) minmax(230px,1fr);gap:14px;align-items:stretch}#stage{min-width:0}#stage>.panel{min-height:540px;height:100%}#rankingPanel{margin-bottom:0}#board{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:14px;width:100%!important;min-width:0;align-items:stretch;justify-items:stretch}#boardPanel{width:100%;min-width:0}#board>*{width:100%;min-width:0}.fieldhead{text-align:center;color:#f5cb6d;font-weight:800;padding:18px 4px;background:#102039;border-radius:9px;font-size:clamp(15px,1.6vw,22px);white-space:nowrap}.tile{width:100%;min-width:0;min-height:132px;padding:18px 6px;white-space:nowrap;background:#23446c;border:1px solid #466c99;border-radius:12px;color:#fff;font-size:clamp(14px,1.6vw,23px);font-weight:800}.tile.done{background:#183c32;color:#80e0a9;border-color:#39795c}.tile small{display:block;margin-top:8px;font-size:15px}.tile:not(:disabled):hover{background:#34669e}#active{display:flex;flex-direction:column;gap:14px}#questionMeta{color:#f5cb6d;margin:0}#questionText{font-size:clamp(25px,3.5vw,55px);font-weight:850;text-align:center;line-height:1.45;overflow-wrap:anywhere;min-height:100px}#questionImage img{max-width:100%;max-height:340px;object-fit:contain}#clock{font-size:clamp(38px,5vw,76px);font-weight:900;color:#f5cb6d;font-variant-numeric:tabular-nums;text-align:center}#submitCount{text-align:center;margin:4px}#reveal{background:#10243a;border:1px solid #41678a;border-radius:14px;padding:14px}#correctText{font-size:clamp(22px,2.5vw,38px)}#rankingPanel h2{color:#f5cb6d}.rank{display:flex;justify-content:space-between;gap:8px;padding:15px 8px;border-bottom:1px solid #324865;font-size:clamp(13px,1.2vw,20px)}.rank strong{color:#f5cb6d;white-space:nowrap}.grade-row{display:grid;grid-template-columns:minmax(65px,100px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #31435e}.grade-answer{overflow-wrap:anywhere}.grade-buttons{display:flex;gap:4px}.grade-buttons button{padding:9px 8px;min-width:49px;background:#263a58;color:#c7d5e8;border:1px solid #405573}.grade-buttons button.selected{background:#397cf0;color:white;border-color:#6da5ff}#finalizeBtn{width:100%;margin-top:15px;padding:17px;font-size:18px}
@media(max-width:900px){main{padding:10px}#gameLayout{grid-template-columns:minmax(0,2.5fr) minmax(150px,1fr);gap:8px}.panel{padding:12px}#stage>.panel{min-height:440px}#board{gap:7px}.tile{min-height:92px;padding:10px 3px}.rank{padding:10px 3px}.grade-row{grid-template-columns:70px minmax(0,1fr);gap:7px}.grade-buttons{grid-column:2}}@media(max-width:600px){header{padding:12px}#gameLayout{grid-template-columns:minmax(0,1fr)}#stage>.panel{min-height:350px}#rankingPanel{margin-bottom:14px}#board{gap:3px}.tile{font-size:11px;min-height:70px;padding:5px 1px;white-space:normal}.fieldhead{font-size:12px;padding:10px 0}.fields{grid-template-columns:1fr}}
#adminToolbar{display:flex;justify-content:flex-end;margin:0 0 12px}#adminToggle{background:#304c70;border:1px solid #6680a3}#adminPanel{margin-top:14px}#adminPanel.hidden{display:none!important}
</style></head><body>
<header><h1>🏆 KOLON QUIZ CHALLENGE</h1><div class="row" style="flex:0 1 auto"><span id="who" class="muted"></span><button id="logout" class="secondary hidden">로그아웃</button></div></header>
<main><section id="setup" class="panel hidden"><h2>Firebase 연결 설정</h2><p class="muted">config.js의 Firebase 설정을 확인하세요.</p></section>
<section id="login" class="panel narrow hidden"><h2>로그인</h2><label>이메일</label><input id="email" type="email" autocomplete="username"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><p><button id="loginBtn">로그인</button></p></section>
<section id="app" class="hidden"><div id="gameLayout"><div id="stage">
<section id="boardPanel" class="panel"><div class="row"><h2>문제 선택판</h2><span id="counter" class="pill">0 / 18</span></div><div id="board"></div></section>
<section id="active" class="panel hidden"><h2 id="questionMeta"></h2><div id="questionText"></div><div id="questionImage"></div><div id="clock">01:00</div><div id="submitCount" class="muted small"></div>
<div id="teamAnswer" class="hidden"><label>우리 팀 답안</label><input id="answerInput" placeholder="정답 입력"><p><button id="submitBtn">답안 제출</button> <span id="submitMsg" class="muted"></span></p></div>
<div id="reveal" class="hidden"><h2>정답: <span id="correctText" class="success"></span></h2></div>
<div id="adminActions" class="hidden"><div id="controlButtons" class="row"><button id="startBtn">60초 시작</button><button id="closeBtn" class="secondary">즉시 마감</button><button id="pauseBtn" class="secondary">일시정지</button><button id="resumeBtn" class="secondary">재개</button></div><p id="adminHint" class="muted small"></p><div id="grading" class="hidden"><h3>팀별 채점</h3><div id="gradingRows"></div><button id="finalizeBtn">점수 반영 및 다음 문제</button></div></div>
</section></div><aside id="rankingPanel" class="panel"><h2>🏅 실시간 순위</h2><div id="ranking"></div></aside></div>
<div id="adminToolbar" class="hidden"><button id="adminToggle" type="button" aria-expanded="false" aria-controls="adminPanel">⚙ 관리자 설정 열기</button></div><section id="adminPanel" class="panel hidden"><h2>관리자 설정</h2><p class="muted small">문제 등록과 팀 정보 관리</p><div class="row"><button id="editTeams">9개 팀 설정</button><button id="editQuestions" class="secondary">18문제 편집</button><button id="exportBtn" class="secondary">결과 CSV 저장</button></div><div id="editor"></div></section></section><p id="notice" class="small muted"></p></main>
<script type="module" src="app.js?v=20261105c"></script></body></html>
